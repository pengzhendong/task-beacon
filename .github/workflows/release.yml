name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$version" = "$plist_version"
          test -n "$SPARKLE_PRIVATE_KEY"

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          keychain="$RUNNER_TEMP/taskbeacon.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n '1s/.*"\(.*\)"/\1/p')"
          test -n "$identity"
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and package
        run: |
          swift build
          swift test
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/package-app.sh
          codesign --verify --deep --strict dist/TaskBeacon.app
          test -s dist/TaskBeacon.app/Contents/Resources/TaskBeacon.icns
          test -s dist/TaskBeacon.app/Contents/Resources/TaskBeaconStatus.png
          codesign --verify --strict dist/TaskBeacon.app/Contents/Helpers/taskbeacond
          codesign --verify --strict dist/TaskBeacon.app/Contents/Resources/bin/taskbeacon
          codesign --verify --strict dist/TaskBeacon.app/Contents/Resources/bin/taskbeacon-mcp
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/taskbeacon-runtime.XXXXXX")"
          socket_path="$runtime_dir/taskbeacon.sock"
          cli="dist/TaskBeacon.app/Contents/Resources/bin/taskbeacon"
          cleanup() {
            TASKBEACON_DATA_DIR="$runtime_dir" TASKBEACON_SOCKET="$socket_path" "$cli" daemon stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          TASKBEACON_DATA_DIR="$runtime_dir" TASKBEACON_SOCKET="$socket_path" "$cli" daemon start
          TASKBEACON_DATA_DIR="$runtime_dir" TASKBEACON_SOCKET="$socket_path" "$cli" daemon status
          TASKBEACON_DATA_DIR="$runtime_dir" TASKBEACON_SOCKET="$socket_path" "$cli" daemon stop
          mkdir -p release

      - name: Notarize app
        if: ${{ env.MACOS_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/TaskBeacon.app "$RUNNER_TEMP/TaskBeacon-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/TaskBeacon-notary.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/TaskBeacon.app

      - name: Create signed update feed
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="release/TaskBeacon-v${version}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/TaskBeacon.app "$archive"
          git log --format='- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" > "release/TaskBeacon-v${version}.md"
          generate_appcast="$(find .build/artifacts -type f -path '*/Sparkle/bin/generate_appcast' -print -quit)"
          test -x "$generate_appcast"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --embed-release-notes \
            --maximum-versions 1 \
            release
          (cd release && shasum -a 256 "TaskBeacon-v${version}.zip" appcast.xml > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/TaskBeacon-*.zip \
            release/appcast.xml \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "TaskBeacon $GITHUB_REF_NAME"
